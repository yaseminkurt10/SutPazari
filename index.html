<!DOCTYPE html>
<html lang="tr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SütPazarı — Tazeliğin En Doğal Hali</title>
    <!-- FontAwesome İkonları -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet.js Harita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #121c17;
            --card-dark: #1b2822;
            --card-accent: #23362d;
            --primary-green: #38a169;
            --light-green: #a3e635;
            --accent-yellow: #f6ad55;
            --text-light: #f7fafc;
            --text-muted: #a0aec0;
            --danger-red: #e53e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 75px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background-color: rgba(18, 28, 23, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark);
            font-size: 18px;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 9px;
            color: var(--primary-green);
            letter-spacing: 1px;
            font-weight: 700;
        }

        .user-nav-btn {
            background: var(--card-accent);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 20px auto 0;
            flex: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .map-card {
            background: var(--card-dark);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(56, 161, 105, 0.3);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .map-header {
            padding: 12px 16px;
            background: var(--card-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        #map {
            height: 230px;
            width: 100%;
            z-index: 1;
            background: #121c17;
        }

        .search-box {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-dark);
            color: white;
            font-size: 14px;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
        }

        .voice-btn {
            background: var(--card-accent);
            border: 1px solid rgba(56, 161, 105, 0.4);
            color: var(--light-green);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .voice-btn.listening {
            background: var(--danger-red);
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .card-item {
            background: var(--card-dark);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s, border-color 0.2s;
        }

        .phone-badge {
            background: rgba(56, 161, 105, 0.15);
            color: var(--light-green);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 6px;
            border: 1px solid rgba(163, 230, 53, 0.2);
        }

        .stock-badge {
            background: rgba(246, 173, 85, 0.15);
            color: var(--accent-yellow);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .city-badge {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .rating-stars {
            color: var(--accent-yellow);
            font-size: 13px;
            margin-top: 4px;
        }

        .btn-primary {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-danger {
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-success {
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-sms {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .product-card {
            background: var(--bg-dark);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--card-dark);
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            padding: 25px;
            border: 1px solid rgba(56, 161, 105, 0.4);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-dark);
            color: white;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 28, 23, 0.98);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
            border: none;
            background: none;
            width: 33%;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--light-green);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-glass-water"></i></div>
            <div class="logo-text">
                <h1>SütPazarı</h1>
                <p>CANLI DAĞITIM & PAZARYERİ</p>
            </div>
        </div>
        <button class="user-nav-btn" onclick="openProfileModal()">
            <i class="fa-solid fa-circle-user" style="color:var(--light-green);"></i>
            <span id="header-user-name">Giriş Yap</span>
        </button>
    </header>

    <div class="container">

        <!-- 1. SEKME: ALICI PANENİ & SÜTÇÜ LİSTESİ -->
        <div id="tab-buyer" class="tab-content active">
            
            <div class="map-card">
                <div class="map-header">
                    <span><i class="fa-solid fa-location-crosshairs" style="color:var(--light-green);"></i> Canlı Sütçü Konum Takibi</span>
                    <span id="live-status-badge" style="color:var(--text-muted); font-size:11px;">Aktif</span>
                </div>
                <div id="map"></div>
            </div>

            <!-- Sesli Arama Özellikli Arama Paneli -->
            <div class="search-box">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" oninput="filterSellers()" placeholder="Sütçü veya İl ara (Yaz veya Konuş)...">
                </div>
                <button class="voice-btn" id="voice-btn" onclick="startVoiceRecognition()" title="Sesle Arama Yap">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>

            <h3 style="margin-bottom:12px; font-size:16px;"><i class="fa-solid fa-store" style="color:var(--primary-green);"></i> Tüm Sütçüler</h3>
            <div id="sellers-list"></div>
        </div>

        <!-- 2. SEKME: SATICI DETAY SAYFASI -->
        <div id="tab-seller-detail" class="tab-content">
            <button onclick="switchTab('tab-buyer')" style="background:none; border:none; color:var(--text-muted); cursor:pointer; margin-bottom:15px; font-size:13px; display:flex; align-items:center; gap:6px;">
                <i class="fa-solid fa-arrow-left"></i> Sütçülere Dön
            </button>

            <div id="seller-detail-content"></div>

            <div style="background: var(--card-dark); padding:20px; border-radius:18px; margin-top:20px; border:1px solid rgba(255,255,255,0.05);">
                <h4 style="margin-bottom:10px; font-size:15px;"><i class="fa-solid fa-star" style="color:var(--accent-yellow);"></i> Satıcıyı Değerlendir</h4>
                <div class="form-group">
                    <label>Puanınız</label>
                    <select id="eval-rating">
                        <option value="5">⭐⭐⭐⭐⭐ (5 - Mükemmel Taze)</option>
                        <option value="4">⭐⭐⭐⭐ (4 - Çok İyi)</option>
                        <option value="3">⭐⭐⭐ (3 - Orta)</option>
                        <option value="2">⭐⭐ (2 - Kötü)</option>
                        <option value="1">⭐ (1 - Tavsiye Etmem)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Yorumunuz</label>
                    <input type="text" id="eval-comment" placeholder="Süt çok taze ve kapıma kadar geldi...">
                </div>
                <button class="btn-primary" onclick="submitReview()">Yorum ve Puanı Gönder</button>
            </div>
        </div>

        <!-- 3. SEKME: SATICI YÖNETİM PANELİ -->
        <div id="tab-seller-dashboard" class="tab-content">
            <div style="background:var(--card-dark); padding:20px; border-radius:18px; margin-bottom:20px; border:1px solid rgba(56,161,105,0.3);">
                <h3 style="margin-bottom:12px; color:var(--light-green); font-size:16px;"><i class="fa-solid fa-plus-circle"></i> Stok & Yeni Ürün Ekle</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group">
                        <label>Ürün Adı</label>
                        <input type="text" id="new-prod-name" placeholder="Örn: Günlük Süt">
                    </div>
                    <div class="form-group">
                        <label>Fiyat (TL)</label>
                        <input type="number" id="new-prod-price" placeholder="40">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group">
                        <label>Mevcut Stok (Litre/Kg)</label>
                        <input type="number" id="new-prod-stock" placeholder="Örn: 50">
                    </div>
                    <div class="form-group">
                        <label>Açıklama</label>
                        <input type="text" id="new-prod-desc" placeholder="Örn: Çiğ İnek Sütü">
                    </div>
                </div>
                <button class="btn-primary" onclick="addNewProduct()"><i class="fa-solid fa-check"></i> Kataloğa Ekle</button>
            </div>

            <h3 style="margin-bottom:10px; font-size:15px;">Ürünleriniz & Stok Durumu</h3>
            <div id="seller-my-products" class="product-grid"></div>

            <h3 style="margin-top:25px; margin-bottom:12px; font-size:15px;">Müşteri Siparişleri & Dağıtım</h3>
            <div id="buyers-orders-list"></div>
        </div>

    </div>

    <!-- Kullanıcı Profil Modalı -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-bottom:10px;"><i class="fa-solid fa-id-card" style="color:var(--primary-green);"></i> Kullanıcı Bilgileri</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:18px;">Siparişte gözükecek adınızı ve numaranızı doğrulayın.</p>
            
            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" id="modal-input-name" placeholder="Örn: Ahmet Yılmaz">
            </div>

            <div class="form-group">
                <label>Telefon Numarası</label>
                <input type="tel" id="modal-input-phone" placeholder="05XX XXX XX XX">
            </div>

            <div class="form-group">
                <label>Bulunduğunuz İl / İlçe</label>
                <input type="text" id="modal-input-city" placeholder="Örn: Diyarbakır / Kayapınar">
            </div>

            <div class="form-group">
                <label>Rolünüz</label>
                <select id="modal-input-role">
                    <option value="buyer">Süt Alıcısı (Müşteri)</option>
                    <option value="seller">Süt Satıcısı (Dağıtıcı)</option>
                </select>
            </div>

            <button class="btn-primary" onclick="saveProfile()"><i class="fa-solid fa-floppy-disk"></i> Bilgileri Kaydet</button>
        </div>
    </div>

    <!-- Alt Navigasyon Barı -->
    <div class="bottom-nav">
        <button class="nav-item active" id="nav-buyer" onclick="switchTab('tab-buyer')">
            <i class="fa-solid fa-basket-shopping"></i>
            <span>Süt Satıcıları</span>
        </button>
        <button class="nav-item" id="nav-seller" onclick="handleSellerTabClick()">
            <i class="fa-solid fa-truck-field"></i>
            <span>Satıcı Paneli</span>
        </button>
        <button class="nav-item" onclick="openProfileModal()">
            <i class="fa-solid fa-user-gear"></i>
            <span>Profilim</span>
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentUser = {
            name: '',
            phone: '',
            city: 'Diyarbakır',
            role: 'buyer'
        };

        let activeSellerDetailId = null;
        let map = null;
        let sellerMarker = null;
        let userMarker = null;
        let animationInterval = null;

        let sellers = [
            {
                id: 1,
                name: "Ahmet Sütçü (Köy Sütçüsü)",
                phone: "0532 111 22 33",
                city: "Diyarbakır / Kayapınar",
                rating: 4.9,
                lat: 37.9150,
                lng: 40.2300,
                products: [
                    { id: 101, name: "Günlük İnek Sütü (1L)", price: 40, stock: 45, desc: "Çiğ, taze, tam yağlı günlük süt." },
                    { id: 102, name: "Köy Yoğurdu (2kg)", price: 75, stock: 12, desc: "Süzme taş gibi ev yoğurdu." }
                ],
                reviews: [
                    { reviewer: "Mehmet K.", stars: "⭐⭐⭐⭐⭐", comment: "Süt harika, kaymağı çok bol çıktı!" }
                ]
            },
            {
                id: 2,
                name: "Mehmet Dağıtım",
                phone: "0544 888 77 66",
                city: "Diyarbakır / Bağlar",
                rating: 4.7,
                lat: 37.9200,
                lng: 40.2200,
                products: [
                    { id: 201, name: "Doğal Yayık Tereyağı (500g)", price: 130, stock: 8, desc: "Geleneksel yayık tereyağı." },
                    { id: 202, name: "Ezine Peynir (500g)", price: 140, stock: 15, desc: "Tam yağlı koyun peyniri." }
                ],
                reviews: [
                    { reviewer: "Ayşe T.", stars: "⭐⭐⭐⭐⭐", comment: "Tereyağı kokusu muazzam taze." }
                ]
            }
        ];

        let orders = [
            {
                id: 501,
                customerName: "Mehmet Yılmaz",
                phone: "0544 999 88 77",
                product: "2 Litre Günlük Süt",
                status: "Bekliyor"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadProfileFromStorage();
            renderSellersList(sellers);
            renderOrdersList();
            setTimeout(initMap, 500);
        });

        function loadProfileFromStorage() {
            try {
                const saved = localStorage.getItem('sutpazari_user');
                if (saved) {
                    currentUser = JSON.parse(saved);
                    document.getElementById('header-user-name').innerText = currentUser.name || 'Giriş Yap';
                    document.getElementById('modal-input-name').value = currentUser.name || '';
                    document.getElementById('modal-input-phone').value = currentUser.phone || '';
                    document.getElementById('modal-input-city').value = currentUser.city || 'Diyarbakır';
                    document.getElementById('modal-input-role').value = currentUser.role || 'buyer';
                } else {
                    openProfileModal();
                }
            } catch(e) {
                console.error(e);
            }
        }

        function openProfileModal() {
            document.getElementById('profile-modal').classList.add('active');
        }

        function saveProfile() {
            const name = document.getElementById('modal-input-name').value.trim();
            const phone = document.getElementById('modal-input-phone').value.trim();
            const city = document.getElementById('modal-input-city').value.trim();
            const role = document.getElementById('modal-input-role').value;

            if (!name || !phone) {
                alert("Lütfen Ad Soyad ve Telefon Numarası giriniz!");
                return;
            }

            currentUser = { name, phone, city: city || 'Diyarbakır', role };
            localStorage.setItem('sutpazari_user', JSON.stringify(currentUser));
            document.getElementById('header-user-name').innerText = name;
            document.getElementById('profile-modal').classList.remove('active');

            if (role === 'seller') {
                switchTab('tab-seller-dashboard');
            } else {
                switchTab('tab-buyer');
            }
        }

        function initMap() {
            if (map !== null) return;
            const mapContainer = document.getElementById('map');
            if (!mapContainer) return;

            try {
                map = L.map('map', {
                    center: [37.9150, 40.2300],
                    zoom: 13,
                    zoomControl: false
                });

                L.tileLayer
